name: CI

# 三道门：
# 1) boundary：分层 / 迁移 / 双端 mapper 契约，分钟级，改边界立刻红；
# 2) verify：全量构建与测试，只有第一道绿了才跑，省 CI 时间；
# 3) frontend：两个前端各自 lint + 单测 + 构建（Windows 本机跑不起 vite 配置打包，
#    只能靠这里的 Linux runner 给结论）。

on:
  push:                    # 任何分支的任何推送都跑（不写 branches 过滤；以前只写 main 导致开发分支不触发）
  pull_request:
  workflow_dispatch:       # 允许在 Actions 页面手动重跑

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    name: 分层与契约护栏
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # surefire 在父 pom 里已固定 argLine=-Duser.home=${project.build.directory}/test-home，
      # 所以 CI 上不需要额外准备 ~/.agentscope。
      - name: 只跑 ArchUnit 与 Schema/Migration 契约
        run: >
          ./mvnw -B -ntp -Pstrict
          -Dtest=ArchitectureTest,SchemaContractTest,MigrationCatalogTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: 失败时上传 surefire 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-boundary
          path: "**/target/surefire-reports/**"
          if-no-files-found: ignore

  verify:
    name: 全量构建与测试
    needs: boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 记录 Docker 可用性
        run: |
          if docker info > /dev/null 2>&1; then
            echo "docker: available"
            docker version --format '{{.Server.Version}}'
          else
            echo "docker: unavailable"
            echo "::error title=Docker 不可用::runner 上没有可用的 Docker，Testcontainers 端到端只能整类跳过。"
          fi

      - name: mvnw verify
        run: ./mvnw -B -ntp -Pstrict verify

      # 四条端到端只在有 Docker 的机器上真跑。本机没有 Docker 时它们整类跳过，
      # 所以「CI 绿」必须能证明它们在 runner 上真的执行过，否则覆盖是假的。
      # 失败时用 ::error 注解输出细节（job 日志要鉴权，注解可匿名读）。
      - name: 端到端用例必须真跑
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          names = [
              "MySqlRedisE2ETest",
              "MySqlRedisChatE2ETest",
              "DataLifecycleE2ETest",
              "TaskScheduleFiringE2ETest",
          ]
          problems = []
          for name in names:
              path = f"agent-bootstrap/target/surefire-reports/TEST-com.zhu.bootstrap.{name}.xml"
              try:
                  root = ET.parse(path).getroot()
              except FileNotFoundError:
                  print(f"::error title={name}::没有 surefire 报告，说明整个类没有跑")
                  problems.append(name)
                  continue
              tests = int(root.get("tests"))
              skipped_count = int(root.get("skipped"))
              detail = (
                  f"tests={tests} skipped={skipped_count} "
                  f"failures={root.get('failures')} errors={root.get('errors')}"
              )
              print(f"{name}: {detail}")
              if tests == 0 or skipped_count:
                  reasons = []
                  for case in root.iter("testcase"):
                      for child in case:
                          if child.tag in ("skipped", "failure", "error"):
                              reasons.append(f"{case.get('name')}: {child.get('message') or child.get('type') or child.tag}")
                  suffix = ("；原因：" + " | ".join(reasons[:5])) if reasons else ""
                  print(f"::error title={name}::{detail}{suffix}")
                  problems.append(name)
          if problems:
              print("这些端到端类没有真正执行（runner 缺 Docker？）：" + ", ".join(problems))
              sys.exit(1)
          PY

      - name: 失败时上传 surefire 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-verify
          path: "**/target/surefire-reports/**"
          if-no-files-found: ignore

  frontend:
    name: 前端（${{ matrix.app }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            dir: web
          - app: web-admin
            dir: web-admin
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: 安装 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ${{ matrix.dir }}/pnpm-lock.yaml

      # --frozen-lockfile：锁文件与 package.json 不一致直接红，避免 CI 偷偷升级依赖。
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: 单测
        run: pnpm test

      - name: 构建
        run: pnpm build
