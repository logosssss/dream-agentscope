name: CI

# 三道门：
# 1) boundary：分层 / 迁移 / 双端 mapper 契约，分钟级，改边界立刻红；
# 2) verify：全量构建与测试，只有第一道绿了才跑，省 CI 时间；
# 3) frontend：两个前端各自 lint + 单测 + 构建（Windows 本机跑不起 vite 配置打包，
#    只能靠这里的 Linux runner 给结论）。

on:
  push:                    # 任何分支的任何推送都跑（不写 branches 过滤；以前只写 main 导致开发分支不触发）
  pull_request:
  workflow_dispatch:       # 允许在 Actions 页面手动重跑

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    name: 分层与契约护栏
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # surefire 在父 pom 里已固定 argLine=-Duser.home=${project.build.directory}/test-home，
      # 所以 CI 上不需要额外准备 ~/.agentscope。
      - name: 只跑 ArchUnit 与 Schema/Migration 契约
        run: >
          ./mvnw -B -ntp -Pstrict
          -Dtest=ArchitectureTest,SchemaContractTest,MigrationCatalogTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: 失败时上传 surefire 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-boundary
          path: "**/target/surefire-reports/**"
          if-no-files-found: ignore

  verify:
    name: 全量构建与测试
    needs: boundary
    runs-on: ubuntu-latest
    # GitHub 托管 runner 的 Docker 走 unix socket。Testcontainers 在自己的
    # 探测里会先看 DOCKER_HOST，显式给出来可以避开「拿不到 socket 就当没有 Docker」。
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 探针的结论要能匿名读：job 日志要鉴权，注解不用。
      # 这一步只诊断、不阻断——阻断交给后面的「端到端用例必须真跑」。
      - name: 记录 Docker 可用性
        run: |
          set +e
          echo "--- 身份与 socket ---"
          id
          ls -l /var/run/docker.sock 2>&1
          echo "DOCKER_HOST=${DOCKER_HOST:-<unset>}"
          echo "--- docker version ---"
          docker version 2>&1 | head -n 12
          echo "--- docker info ---"
          docker info 2>&1 | head -n 8
          echo "--- docker run --rm hello-world ---"
          timeout 180 docker run --rm hello-world > /tmp/hello.log 2>&1
          rc=$?
          echo "exit=$rc"
          detail=$(tail -n 3 /tmp/hello.log 2>/dev/null | tr '\n' ' ')
          sock=$(ls -l /var/run/docker.sock 2>&1 | tr '\n' ' ')
          host="${DOCKER_HOST:-<unset>}"
          echo "::warning title=docker-probe::hello-world exit=$rc host=$host socket=$sock detail=$detail"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Docker 不可用::docker run hello-world 退出码 $rc；Testcontainers 端到端会被整类跳过。"
          fi

      - name: mvnw verify
        run: ./mvnw -B -ntp -Pstrict verify

      # 四条端到端只在有 Docker 的机器上真跑。本机没有 Docker 时它们整类跳过，
      # 所以「CI 绿」必须能证明它们在 runner 上真的执行过，否则覆盖是假的。
      # 失败时用 ::error 注解输出细节（job 日志要鉴权，注解可匿名读）。
      - name: 端到端用例必须真跑
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          names = [
              "MySqlRedisE2ETest",
              "MySqlRedisChatE2ETest",
              "DataLifecycleE2ETest",
              "TaskScheduleFiringE2ETest",
          ]
          problems = []
          total = 0
          for name in names:
              path = f"agent-bootstrap/target/surefire-reports/TEST-com.zhu.bootstrap.{name}.xml"
              try:
                  root = ET.parse(path).getroot()
              except FileNotFoundError:
                  print(f"::error title={name}::没有 surefire 报告，说明整个类没有跑")
                  problems.append(name)
                  continue
              tests = int(root.get("tests"))
              skipped_count = int(root.get("skipped"))
              total += tests
              detail = (
                  f"tests={tests} skipped={skipped_count} "
                  f"failures={root.get('failures')} errors={root.get('errors')}"
              )
              print(f"{name}: {detail}")
              if tests == 0 or skipped_count:
                  reasons = []
                  for case in root.iter("testcase"):
                      for child in case:
                          if child.tag in ("skipped", "failure", "error"):
                              reasons.append(f"{case.get('name')}: {child.get('message') or child.get('type') or child.tag}")
                  suffix = ("；原因：" + " | ".join(reasons[:5])) if reasons else ""
                  print(f"::error title={name}::{detail}{suffix}")
                  problems.append(name)
          # 整个 bootstrap 用例数也应该在 400 以上；明显偏小说明测试根本没跑（不是 Docker 的问题）。
          all_tests = 0
          for report in Path("agent-bootstrap/target/surefire-reports").glob("TEST-com.zhu.bootstrap.*.xml"):
              try:
                  all_tests += int(ET.parse(report).getroot().get("tests"))
              except Exception:
                  pass
          print(f"agent-bootstrap 报告合计：{all_tests} 例（四条端到端占 {total} 例）")
          if all_tests < 400:
              print(f"::error title=测试没有跑起来::agent-bootstrap 只有 {all_tests} 例报告，期望 400 以上，检查 mvnw verify 是否被跳过")
              problems.append("bootstrap totals")

          # shell 里 docker 可用、JVM 里 Testcontainers 却说不可用——把 JVM 侧看到的原始报错也打出来。
          probe_path = Path(
              "agent-bootstrap/target/surefire-reports/TEST-com.zhu.bootstrap.DockerProbeTest.xml"
          )
          try:
              probe_root = ET.parse(probe_path).getroot()
              probe_lines = []
              for out in probe_root.iter("system-out"):
                  for line in (out.text or "").splitlines():
                      probe = line.startswith("probe.")
                      dockerish = ("docker" in line.lower() or "containers" in line.lower()) and not line.startswith("at ")
                      if probe or dockerish:
                          probe_lines.append(line.strip())
              summary = " | ".join(probe_lines[:12]) or "探针没有输出"
              print(f"::warning title=docker-java-probe::{summary[:6000]}")
          except FileNotFoundError:
              print("::warning title=docker-java-probe::没有 DockerProbeTest 报告")

          if problems:
              print("端到端或用例数断言失败：" + ", ".join(problems))
              sys.exit(1)
          PY

      - name: 失败时上传 surefire 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-verify
          path: "**/target/surefire-reports/**"
          if-no-files-found: ignore

  frontend:
    name: 前端（${{ matrix.app }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            dir: web
          - app: web-admin
            dir: web-admin
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: 安装 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ${{ matrix.dir }}/pnpm-lock.yaml

      # --frozen-lockfile：锁文件与 package.json 不一致直接红，避免 CI 偷偷升级依赖。
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: 单测
        run: pnpm test

      - name: 构建
        run: pnpm build
