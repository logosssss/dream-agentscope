# 用户进程骨架配置。业务旋钮与连接/进程参数以 Nacos 为准（见 deploy/nacos/）。
# - agent-bootstrap.yaml      业务（可热更）
# - agent-bootstrap-infra.yaml 连接、密钥、multipart/lifecycle/hikari（启动一次）
# NACOS_ADDR 为空时不拉 Nacos：请取消注释文末「无 Nacos 本地兜底」。
# Flyway 在本进程执行。Redis 自动配置排除，改由 agentscope.cache.redis 建连。

server:
  shutdown: graceful

spring:
  # servlet.multipart / lifecycle / datasource.* → agent-bootstrap-infra.yaml
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

agentscope:
  runtime:
    # 状态命名空间与展示名不进 Nacos 热更白名单；改身份请升 agent-id。
    agent-id: companion-v1
    name: companion
    # model / max-iters / timeout-seconds / max-user-chars / max-write-bytes
    # → agent-bootstrap.yaml（Java 字段自带缺省，无 Nacos 时用类默认值）
  startup:
    dependencies:
      # 正式启动探测 MySQL、Redis、Milvus。测试配置关掉。
      enabled: true
  distributed:
    mysql:
      # 必须打开。表由 Flyway 创建，MyBatis-Plus 不建表。
      enabled: true
      create-if-not-exist: false
  # access / auth / permission / wx 非密钥 → agent-bootstrap.yaml
  # caller / cache / milvus / object-store / wx 密钥 / otel / spring 进程参数 → infra
  task:
    # sync 在当前线程执行。改成 mq 会拒绝启动，RocketMQ 依赖还没引入。
    mode: sync
  nacos:
    # 仅 Nacos 自身留环境变量。配了地址必须拉到 infra + 业务两份。
    server-addr: ${NACOS_ADDR:}
    namespace: ${NACOS_NAMESPACE:}
    username: ${NACOS_USERNAME:}
    password: ${NACOS_PASSWORD:}

# 空字段不插入，让表默认值生效。
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    banner: false
    db-config:
      id-type: auto
      insert-strategy: not_null
  configuration:
    map-underscore-to-camel-case: true

