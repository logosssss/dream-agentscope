# 正式启动必须连上 MySQL、Redis、Milvus。地址和账号只从环境变量来，仓库里不写死。
# Flyway 在本进程执行。Redis 自动配置排除，改由 agentscope.cache.redis 创建连接。
# 停机时先不再接新 HTTP，等待时间与单次调用超时对齐。容器的终止宽限不要短于这个时间。
server:
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 120s
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      # 本进程最多 20 个连接。管理进程另有一份同样大小的池。MySQL max_connections 必须盖住这两份，再留运维连接。
      maximum-pool-size: 20
      minimum-idle: 5
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

agentscope:
  runtime:
    # 模型坐标。密钥走环境变量，不写进仓库。
    model: ${AGENTSCOPE_MODEL:dashscope:qwen-plus}
    # 状态命名空间。和下面的展示名分开，改名不会把会话指到空库。
    agent-id: companion-v1
    name: companion
    max-iters: 20
    timeout-seconds: 120
    # 单次写文件的 UTF-8 字节上限。超过的 write_file / write_text_file / insert_text_file 不会执行。
    max-write-bytes: 5242880
    # 用户输入的字符上限。系统提示词里的 {{变量}} 未替换时拒绝进入模型。
    max-user-chars: 32768
  startup:
    dependencies:
      # 正式启动探测三个依赖。测试配置把它关掉。
      enabled: true
  distributed:
    mysql:
      # 必须打开。没有进程内审计。表由 Flyway 创建，MyBatis-Plus 不建表。
      enabled: true
      create-if-not-exist: false
  access:
    # 0 表示不限制。打开后按租户用户计当日次数和每分钟次数。
    daily-limit: 0
    per-minute: 0
  caller:
    # 调用方令牌。空则除存活和就绪外全部拒绝。不是用户登录，仓库不放值。
    token: ${AGENTSCOPE_CALLER_TOKEN:}
  cache:
    redis:
      # 必须打开。主机来自环境变量，为空则拒绝启动。
      enabled: true
      host: ${AGENTSCOPE_REDIS_HOST:}
      port: ${AGENTSCOPE_REDIS_PORT:6379}
  milvus:
    # 地址为空或连不上就退出。连通后创建 knowledge 和 episodic_memory 集合。不写入，也不检索。
    uri: ${MILVUS_URI:}
    token: ${MILVUS_TOKEN:}
    collection: ${MILVUS_COLLECTION:knowledge}
    dimensions: ${MILVUS_DIMENSIONS:1024}
  task:
    # sync 在当前线程执行。改成 mq 会拒绝启动，RocketMQ 依赖还没引入。
    mode: sync
  otel:
    # 空则不导出 span。地址只来自环境变量，不写死采集器。
    endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}
    service-name: ${OTEL_SERVICE_NAME:agentscope-user}
  nacos:
    # 只监听提示词。地址为空不建客户端。拉失败用兜底，不让进程退出。
    # 不做动态配置、服务发现和 MCP。账号和命名空间没配就不传。
    server-addr: ${NACOS_ADDR:}
    namespace: ${NACOS_NAMESPACE:}
    username: ${NACOS_USERNAME:}
    password: ${NACOS_PASSWORD:}
  permission:
    # 没写规则时一律 ALLOW。tenant-id、role-id 用 * 表示全部，priority 越小越优先。
    # 决定只能是 ALLOW、ASK、DENY。写错会拒绝启动。
    rules: []

# 空字段不插入，让表默认值生效。没有数据源时这套配置不会启动。
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    banner: false
    db-config:
      id-type: auto
      insert-strategy: not_null
  configuration:
    map-underscore-to-camel-case: true
