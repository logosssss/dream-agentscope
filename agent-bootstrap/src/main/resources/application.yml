# 正式启动必须连上 MySQL、Redis、Milvus。地址和账号只从环境变量来，仓库里不写死。
# Flyway 在本进程执行。Redis 自动配置排除，改由 agentscope.cache.redis 创建连接。
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

agentscope:
  runtime:
    # 模型坐标。密钥走环境变量，不写进仓库。
    model: ${AGENTSCOPE_MODEL:dashscope:qwen-plus}
    # 状态命名空间。和下面的展示名分开，改名不会把会话指到空库。
    agent-id: product-agent
    name: product-agent
    max-iters: 20
    timeout-seconds: 120
    # 单次写文件的 UTF-8 字节上限。超过的 write_file / write_text_file / insert_text_file 不会执行。
    max-write-bytes: 5242880
  startup:
    dependencies:
      # 正式启动探测三个依赖。测试配置把它关掉。
      enabled: true
  distributed:
    mysql:
      # 必须打开。没有进程内审计。表由 Flyway 创建，MyBatis-Plus 不建表。
      enabled: true
      create-if-not-exist: false
  access:
    # 0 表示不限制。打开后按租户用户计当日次数和每分钟次数。
    daily-limit: 0
    per-minute: 0
  cache:
    redis:
      # 必须打开。主机来自环境变量，为空则拒绝启动。
      enabled: true
      host: ${AGENTSCOPE_REDIS_HOST:}
      port: ${AGENTSCOPE_REDIS_PORT:6379}
  milvus:
    # 只探测这个地址能否连通。不建集合，不做检索。环境变量没配时为空，启动失败。
    uri: ${MILVUS_URI:}
  task:
    # sync 在当前线程执行。改成 mq 会拒绝启动，RocketMQ 依赖还没引入。
    mode: sync
  permission:
    # 没写规则时一律 ALLOW。tenant-id、role-id 用 * 表示全部，priority 越小越优先。
    # 决定只能是 ALLOW、ASK、DENY。写错会拒绝启动。
    rules: []

# 空字段不插入，让表默认值生效。没有数据源时这套配置不会启动。
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    banner: false
    db-config:
      id-type: auto
      insert-strategy: not_null
  configuration:
    map-underscore-to-camel-case: true
