# 测试不连 Redis、MySQL、Milvus。下面的值只覆盖正式配置，不是生产开关。
# 测试立刻停机，避免上下文关闭时按正式的 120 秒等待。
server:
  shutdown: immediate

spring:
  lifecycle:
    timeout-per-shutdown-phase: 1s
  datasource:
    url: jdbc:mysql://127.0.0.1:1/unused
    username: test
    password: ""
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

agentscope:
  startup:
    dependencies:
      enabled: false
  distributed:
    mysql:
      enabled: false
  cache:
    redis:
      enabled: false
      host: ""
  milvus:
    uri: ""
  nacos:
    # 测试不连 Nacos，即使本机配了地址。
    server-addr: ""
  otel:
    # 测试不导出 span，即使本机配了采集器地址。
    endpoint: ""
  caller:
    # 只给测试请求带上。正式配置为空，不把这个值当成生产令牌。
    token: test-token
  wakeup:
    # 测试用唤醒令牌；正式环境用 AGENTSCOPE_WAKEUP_TOKEN。
    token: test-wakeup-token
  runtime:
    wakeup:
      enabled: false
