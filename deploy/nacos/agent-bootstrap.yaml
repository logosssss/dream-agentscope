# 粘贴到 Nacos 配置中心时：
#   Data ID : agent-bootstrap.yaml
#   Group   : AGENT_PLATFORM
#   格式    : YAML
# 用户进程启动拉取；配了 NACOS_ADDR 后进程内监听热更新。
# 非法推送会拒收并保留上一份。只影响之后新请求。
# 连接与密钥请写到 agent-bootstrap-infra.yaml。键须在 classpath:nacos-allowlist.yml。

agentscope:
  access:
    # 公开演示建议收紧；0 表示不限制。租户表有启用 REQUESTS/DAILY 时以表为准。
    daily-limit: 30
    # 每个用户每分钟同一入口次数。公开演示建议 6，防刷。
    per-minute: 6
    # 登录会话在 Redis 的有效秒数。小于 1 时进程按一天处理。
    login-session-seconds: 86400
  runtime:
    # 无 model_config 行时的模型坐标。密钥在 infra / 环境变量。
    model: dashscope:qwen-plus
    max-iters: 20
    timeout-seconds: 120
    max-user-chars: 32768
    max-write-bytes: 5242880
    # Sandbox 默认关；仅 companion 在 enabled=true 时换 Docker。见 docs/sandbox-落地.md。
    sandbox:
      enabled: false
      # image: ubuntu:24.04
    # Wakeup 默认关；仅 companion；令牌环境变量 AGENTSCOPE_WAKEUP_TOKEN。见 docs/wakeup-落地.md。
    wakeup:
      enabled: false
  auth:
    # 自助注册进入的租户。必须已登记且 ACTIVE。
    tenant-id: demo
  wx:
    mini:
      login-page: pages/login-confirm/index
      env-version: release
      ticket-ttl-seconds: 300
  permission:
    # MySQL 打开时以 tool_permission 表为准；mysql 关闭时用这里。
    # 内置 web 工具已在代码侧关闭；这里再 DENY 一道，防止以后误开。
    rules:
      - tool-id: web_fetch
        tenant-id: "*"
        role-id: "*"
        decision: DENY
        priority: 1
        enabled: true
      - tool-id: web_search
        tenant-id: "*"
        role-id: "*"
        decision: DENY
        priority: 1
        enabled: true
