# 测试不连 Redis、MySQL、Milvus。下面的值只覆盖正式配置，不是生产开关。
# 测试立刻停机，避免上下文关闭时按正式配置等待。
server:
  shutdown: immediate

spring:
  lifecycle:
    timeout-per-shutdown-phase: 1s
  datasource:
    url: jdbc:mysql://127.0.0.1:1/unused
    username: test
    password: ""
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

agentscope:
  startup:
    dependencies:
      enabled: false
  distributed:
    mysql:
      enabled: false
  cache:
    redis:
      enabled: false
      host: ""
  milvus:
    uri: ""
  caller:
    # 只给测试请求带上。正式配置为空，不把这个值当成生产令牌。
    token: test-token
