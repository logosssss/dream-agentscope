# 管理进程骨架。连接、停机等待、连接池见 deploy/nacos/agent-admin-infra.yaml。
# NACOS_ADDR 为空时取消注释文末兜底。不跑 Flyway。

server:
  port: 8100
  shutdown: graceful

spring:
  # lifecycle / datasource.* → agent-admin-infra.yaml
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

agentscope:
  startup:
    dependencies:
      enabled: true
  distributed:
    mysql:
      # 打开后才创建查询和决定的 Mapper。本进程不建表。
      enabled: true
  # cache / milvus / admin.token → agent-admin-infra.yaml
  nacos:
    server-addr: ${NACOS_ADDR:}
    namespace: ${NACOS_NAMESPACE:}
    username: ${NACOS_USERNAME:}
    password: ${NACOS_PASSWORD:}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    banner: false
    db-config:
      id-type: auto
      insert-strategy: not_null
  configuration:
    map-underscore-to-camel-case: true

